name: Validate

# Every ISC site installs this package straight from a git ref, so a broken
# commit — a bad <template>, a missing import, an `exports` map pointing at a
# file that no longer exists — reaches five deployments with nothing in
# between. This is that missing step.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # A tag is what the sites pin, so a tag whose name disagrees with the
      # manifest would install a version that claims to be something else.
      - name: Tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          echo "tag=$TAG  package.json=$PKG"
          [ "$TAG" = "$PKG" ] || {
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $PKG"
            exit 1
          }

      # test/smoke is a minimal Vite app that depends on this checkout through
      # `file:../..`, imports every export and renders every component. The
      # bundler compiling it is the actual assertion.
      - name: Build the smoke consumer
        working-directory: test/smoke
        run: |
          bun install
          bun run build
